name: Build candidate locally on runner
# No artifact upload or Release creation. Inspect CI logs before any publication.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_public.py
      - shell: pwsh
        run: ./build.ps1
      - name: Startup self-test
        shell: pwsh
        run: |
          $version = python -c "from link_rules import VERSION; print(VERSION)"
          $exe = Join-Path $PWD "dist/EmbyLinkStudio-v$version.exe"
          $report = Join-Path $PWD "build/gui-smoke.json"
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test', $report -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'GUI startup failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.gui -ne 'ok' -or $result.version -ne $version) { throw 'Version mismatch' }
