name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb xauth
      - name: Windows tests
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -t . -p "test_*.py"
      - name: Linux tests including kernel protection
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -t . -p "test_*.py"
      - name: Tracked source privacy check
        run: python tools/check_public.py
      - name: Public bundle check
        run: |
          python package_deploy.py
          python tools/check_release.py dist
